<title>清单生成器</title>
<style>
/* ============================================================
   清单生成器 · iOS 移动端样式
   配色 / 字号 / 间距 全部对齐 Ardot 设计稿
   ============================================================ */

:root{
  /* 主色 */
  --accent:#2E9E7E;
  --accent-deep:#2E7D66;
  --accent-soft:#F1F7F4;
  --accent-soft-2:#E8F1ED;
  --accent-border:#DCEAE4;

  /* 文字 */
  --t1:#16181C;
  --t2:#2A2E34;
  --t3:#4A5058;
  --t4:#8A9099;
  --t5:#AEB4BD;

  /* 背景与描边 */
  --bg:#F2F3F5;
  --card:#FFFFFF;
  --line:#EDEFF2;
  --line-2:#E6E9ED;
  --track:#ECEEF1;
  --dot-off:#C9CFD8;
  --fill-grey:#F7F8FA;

  /* 安全区 */
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  --sal:env(safe-area-inset-left, 0px);
  --sar:env(safe-area-inset-right, 0px);

  /* 尺寸 */
  --tabbar-h:62px;
  --nav-h:44px;
}

*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;
  position:fixed;
  overscroll-behavior:none;
  background:var(--bg);
}

/* ---------- 禁止文字选中 / 长按系统菜单 ---------- */
html,body,div,span,a,p,h1,h2,h3,h4,label,li,ul,ol,button{
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
  font-family:inherit;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
  color:var(--t2);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  touch-action:manipulation;
}

/* ---------- App 容器 ---------- */
#app{
  position:fixed;
  inset:0;
  background:var(--bg);
  overflow:hidden;
}

.stacks{position:absolute;inset:0;}
.stack{position:absolute;inset:0;display:none;}
.stack.active{display:block;}
/* 非栈顶页面不接收指针事件，避免被覆盖的底层 CTA 误拦截点击 */
.stack > .screen:not(:last-child){ pointer-events:none; }

/* ---------- 页面 ---------- */
.screen{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  transform:translate3d(0,0,0);
  will-change:transform;
  transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.screen.push-in{transform:translate3d(100%,0,0);}
.screen.pop-out{transform:translate3d(100%,0,0);}
.screen.dragging{transition:none;}
.screen.dim{filter:brightness(.94);}

/* 顶部安全区占位（背景色延伸进状态栏区域，不画假状态栏） */
.safe-top{
  flex:0 0 auto;
  height:var(--sat);
  background:var(--bg);
}
.screen-head-white + .screen-body .safe-top{background:#fff;}

/* ---------- 滚动容器 ---------- */
.screen-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding:8px 20px calc(28px + var(--tabbar-h) + var(--sab)) 20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
/* 关键：防止子项（尤其是 .card overflow:hidden）在 flex 列中被压缩裁剪，
   导致内容无法撑开、整页不滚动。子项保持自然高度，超长页面才能正常滚动。 */
.screen-body > *{ flex-shrink:0; }
.screen-body.no-tab{
  padding-bottom:calc(16px + var(--sab));
}
.screen-body::-webkit-scrollbar{width:0;height:0;display:none;}

/* ============================================================
   导航条
   ============================================================ */
.navbar{
  flex:0 0 auto;
  position:relative;
  display:flex;
  align-items:center;
  gap:4px;
  height:var(--nav-h);
  padding:0 8px;
  background:var(--bg);
}
.navbar .nav-side{
  min-width:64px;
  display:flex;
  align-items:center;
  gap:2px;
}
.navbar .nav-side.right{justify-content:flex-end;}
.navbar .nav-title{
  flex:1 1 auto;
  text-align:center;
  font-size:17px;
  font-weight:600;
  color:var(--t1);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.nav-btn{
  display:flex;align-items:center;justify-content:center;
  gap:1px;
  min-width:44px;height:44px;
  padding:0 6px;
  border:0;background:transparent;
  color:var(--accent);
  font-size:16px;font-weight:500;
  border-radius:12px;
  transition:opacity .12s;
}
.nav-btn .chev{width:12px;height:20px;display:block;}
.nav-btn.ghost{color:var(--t4);}
.nav-btn.icon{min-width:44px;padding:0;}

/* 大标题页头 */
.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.page-head h1{
  margin:0;
  font-size:28px;
  font-weight:700;
  color:var(--t1);
  letter-spacing:-.4px;
}
.round-btn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;
  border:0;border-radius:18px;
  background:var(--accent);
  flex:0 0 auto;
}
.round-btn.grey{background:var(--fill-grey);border:1px solid var(--line-2);}
.round-btn.lg{width:44px;height:44px;border-radius:22px;}

/* ============================================================
   Pill Tab Bar
   ============================================================ */
.tabbar{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:60;
  padding:12px 21px calc(8px + var(--sab)) 21px;
  padding-left:calc(21px + var(--sal));
  padding-right:calc(21px + var(--sar));
  background:linear-gradient(to top, rgba(242,243,245,.98) 62%, rgba(242,243,245,0));
  pointer-events:none;
}
.tab-pill{
  pointer-events:auto;
  display:flex;
  gap:4px;
  height:var(--tabbar-h);
  padding:4px;
  border-radius:36px;
  background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    0 8px 22px -6px rgba(23,26,30,.12);
}
.tab-item{
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  border:0;
  border-radius:26px;
  background:transparent;
  padding:0 2px;
  transition:background-color .18s, transform .12s;
}
.tab-item .tab-ico{
  width:18px;height:18px;display:block;flex:0 0 auto;
}
.tab-item .tab-label{
  font-size:10px;
  font-weight:600;
  letter-spacing:.2px;
  color:var(--t5);
  line-height:12px;
  white-space:nowrap;
}
.tab-item.on{background:var(--accent);}
.tab-item.on .tab-label{color:#fff;}
.tab-item:not(.on) .tab-ico{color:var(--t5);}
.tab-item.on .tab-ico{color:#fff;}
.tab-item.pressed{transform:scale(.94);}

/* ============================================================
   通用卡片 / 列表
   ============================================================ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.card.pad{padding:16px;}
.card.pad-sm{padding:14px;}

.section-title{
  margin:0;
  font-size:14px;
  font-weight:700;
  color:var(--t1);
}
.section-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.section-row .more{
  font-size:12px;font-weight:600;color:var(--accent);
}

/* 进度卡 */
.progress-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  display:flex;flex-direction:column;gap:10px;
}
.progress-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.progress-status{font-size:12px;font-weight:600;color:var(--t4);}
.progress-count{font-size:18px;font-weight:700;color:var(--accent);}
.progress-track{
  height:6px;border-radius:3px;background:var(--track);overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:3px;background:var(--accent);
  transition:width .3s cubic-bezier(.32,.72,0,1);
}
.progress-note{font-size:12px;color:var(--t4);}

.meta-line{font-size:12px;color:var(--t4);}

/* 筛选条 */
.filter-row{display:flex;gap:8px;}
.chip-seg{
  flex:1 1 0;min-width:0;
  height:38px;
  border:1px solid var(--line-2);
  border-radius:12px;
  background:var(--card);
  color:var(--t4);
  font-size:12px;font-weight:500;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;
  white-space:nowrap;
  transition:background-color .16s,color .16s,border-color .16s,transform .12s;
}
.chip-seg.on{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;font-weight:600;
}
.chip-seg.pressed{transform:scale(.96);}

/* 清单行：三段式 —— 左 完成 / 中 内容 / 右 不需要 */
.row{
  display:flex;align-items:center;gap:8px;
  min-height:54px;
  width:100%;
  padding:6px 8px;
  border:0;background:transparent;
  text-align:left;
  transition:opacity .22s cubic-bezier(.32,.72,0,1);
}
.row .row-dot{
  flex:0 0 auto;width:20px;height:20px;display:block;
}

/* 左：完成状态控件（细线圆 + 描边勾选，靠 .on 切换，无大色块填充） */
.row-check{
  flex:0 0 auto;
  width:42px;height:42px;min-width:42px;min-height:42px;
  display:flex;align-items:center;justify-content:center;
  margin:0;padding:0;border:0;background:transparent;border-radius:50%;
  transition:transform .14s cubic-bezier(.32,.72,0,1);
  -webkit-tap-highlight-color:transparent;
}
.row-check.pressed{transform:scale(.86);}
.row-check .check-svg{width:26px;height:26px;display:block;overflow:visible;}
.row-check .ck-circle{
  fill:none;stroke:var(--dot-off);stroke-width:1.8;
  transition:stroke .2s ease,fill .2s ease;
}
.row-check .ck-mark{
  fill:none;stroke:#fff;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;
  transition:stroke-dashoffset .24s cubic-bezier(.32,.72,0,1);
}
.row-check.on .ck-circle{stroke:var(--accent);fill:var(--accent);}
.row-check.on .ck-mark{stroke-dashoffset:0;}

/* 中：内容区 */
.row-main{
  flex:1 1 auto;min-width:0;
  display:flex;flex-direction:column;gap:3px;
  justify-content:center;min-height:40px;
}
.row-main .row-label{
  font-size:15px;font-weight:500;color:var(--t2);
  line-height:20px;overflow-wrap:anywhere;
}
.row-main .row-label .row-meta{font-size:12px;color:var(--t4);font-weight:500;margin-left:3px;}
.row-tags{display:flex;flex-wrap:wrap;gap:5px;}

/* 右：「不需要」独立操作区（轻量文字按钮，不并入左按钮） */
.row-skip{
  flex:0 0 auto;
  min-width:58px;min-height:38px;
  margin:0;padding:0 10px;
  border:0;background:transparent;border-radius:11px;
  color:var(--t4);
  font-size:13px;font-weight:500;
  white-space:nowrap;
  transition:color .16s ease,background-color .16s ease,transform .14s cubic-bezier(.32,.72,0,1);
}
.row-skip.pressed{transform:scale(.93);background:var(--fill-grey);}
.row-skip.is-skip{color:var(--accent);}

/* 状态态：已完成轻微淡化 + 细线划线；不需要灰化低强调，不删除不消失 */
.row.done .row-label{color:var(--t4);text-decoration:line-through;text-decoration-color:var(--t5);text-decoration-thickness:1px;}
.row.skip{opacity:.6;}
.row.skip .row-label{color:var(--t4);}

.row .row-meta{
  flex:0 0 auto;font-size:12px;color:var(--t4);font-weight:500;
}
.row .chev{color:var(--dot-off);font-size:20px;line-height:1;flex:0 0 auto;}

/* 搬家用：整行一个状态控件（保留四态装箱流程） */
.row-hit{
  flex:0 0 auto;
  min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  margin-right:-8px;
  transition:transform .14s cubic-bezier(.32,.72,0,1);
}
.row-hit.pressed{transform:scale(.9);}

.tag-chip{
  flex:0 0 auto;
  padding:3px 7px;border-radius:6px;
  font-size:11px;font-weight:600;
  color:var(--accent-deep);
  background:var(--accent-soft);
  white-space:nowrap;
}
.tag-chip.cycle{background:var(--accent-soft-2);}
.tag-chip.grey{background:var(--fill-grey);color:var(--t4);border:1px solid var(--line-2);}
.add-row{
  display:flex;align-items:center;gap:8px;
  width:100%;min-height:44px;padding:7px 12px;
  border:0;background:transparent;color:var(--t4);
  font-size:14px;font-weight:500;
}
.add-row.pressed{background:var(--fill-grey);}
.add-row .plus{
  width:18px;height:18px;flex:0 0 auto;color:var(--accent);
}

.rows{padding:4px;display:flex;flex-direction:column;}
.rows > * + *{border-top:1px solid var(--line);}

/* 首页进行中卡片 */
.mini-card{
  display:flex;flex-direction:column;gap:10px;
  padding:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  width:100%;
  text-align:left;
  transition:transform .12s,background-color .14s;
}
.mini-card.pressed{transform:scale(.985);background:var(--fill-grey);}
.mini-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.mini-name{font-size:15px;font-weight:600;color:var(--t1);}
.mini-num{font-size:13px;font-weight:600;color:var(--accent);}
.mini-sub{font-size:12px;color:var(--t4);}

/* chips 横向滚动 */
.chips-scroll{
  display:flex;gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding:2px 0;
  margin:0 -20px;
  padding-left:20px;padding-right:20px;
  scrollbar-width:none;
}
.chips-scroll::-webkit-scrollbar{display:none;}
.chip-tag{
  flex:0 0 auto;
  padding:7px 12px;border-radius:14px;
  background:var(--fill-grey);
  border:1px solid var(--line-2);
  font-size:13px;font-weight:500;color:var(--t3);
  transition:background-color .14s,transform .12s;
}
.chip-tag.pressed{transform:scale(.96);}
.chip-tag.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.chip-tag.selectable{padding-right:6px;}

/* 快速新建 4 宫格 */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.quick-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 4px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  transition:transform .12s,background-color .14s;
}
.quick-item.pressed{transform:scale(.96);background:var(--fill-grey);}
.quick-ico{
  width:26px;height:26px;color:var(--accent);
}
.quick-name{font-size:12px;font-weight:500;color:var(--t3);}

/* 场景选择分组 */
.group{margin:0;font-size:14px;font-weight:700;color:var(--t1);}
.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.scene-item{
  position:relative;
  min-height:56px;
  padding:10px 8px;
  border-radius:14px;
  border:1px solid var(--line-2);
  background:var(--card);
  font-size:14px;font-weight:500;color:var(--t3);
  display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:19px;
  transition:background-color .16s,color .16s,border-color .16s,transform .12s;
}
.scene-item.pressed{transform:scale(.97);}
.scene-item.on{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
}
.scene-item.on::after{
  content:"";position:absolute;top:6px;right:6px;
  width:14px;height:14px;border-radius:7px;
  background:#fff;
}
.scene-item.on::before{
  content:"";position:absolute;top:9px;right:9px;z-index:1;
  width:8px;height:5px;
  border-left:1.8px solid var(--accent);
  border-bottom:1.8px solid var(--accent);
  transform:rotate(-45deg);
}

/* 条件选择块 */
.cond-block{display:flex;flex-direction:column;gap:10px;}
.cond-title{font-size:14px;font-weight:700;color:var(--t1);}
.cond-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cond-grid.c2{grid-template-columns:repeat(2,1fr);}
.cond-opt{
  min-height:46px;padding:8px 6px;
  border-radius:12px;
  border:1px solid var(--line-2);
  background:var(--card);
  font-size:14px;font-weight:500;color:var(--t3);
  display:flex;align-items:center;justify-content:center;text-align:center;
  transition:background-color .16s,color .16s,border-color .16s,transform .12s;
}
.cond-opt.pressed{transform:scale(.97);}
.cond-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600;}

/* Switch */
.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:52px;padding:6px 14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
}
.switch-row .sw-label{font-size:15px;font-weight:500;color:var(--t2);}
.switch-row .sw-sub{font-size:12px;color:var(--t4);}
.switch{
  position:relative;flex:0 0 auto;
  width:50px;height:30px;border-radius:15px;
  border:0;background:var(--line-2);
  transition:background-color .22s;
  padding:0;
}
.switch.on{background:var(--accent);}
.switch .knob{
  position:absolute;top:3px;left:3px;
  width:24px;height:24px;border-radius:12px;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.16);
  transition:transform .22s cubic-bezier(.32,.72,0,1);
}
.switch.on .knob{transform:translateX(20px);}

/* 底部 CTA —— 预留底部 Tab 高度，按钮始终位于 Tab 之上、不被遮挡 */
.cta-host{
  flex:0 0 auto;
  position:relative;
  z-index:55;
  padding:10px 20px calc(var(--tabbar-h) + 28px + var(--sab)) 20px;
  padding-left:calc(20px + var(--sal));
  padding-right:calc(20px + var(--sar));
  background:linear-gradient(to top,rgba(242,243,245,.98) 60%,rgba(242,243,245,0));
}
/* 含底部 CTA 的页面，滚动内容底部预留空间，最后一项不被遮住 */
.screen-body.has-cta{
  padding-bottom:calc(12px + var(--sab));
}
.cta{
  width:100%;min-height:52px;
  border:0;border-radius:16px;
  background:var(--accent);

function svg(name, cls) {
  return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + (ICONS[name] || '') + '</svg>';
}

/* 状态圆点（三种清单共用绘制） */
function dotSvg(state, kind) {
  if (kind === 'move') {
    if (state === 'packed') {
      return '<svg class="row-dot" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="10" fill="#2E9E7E"/><rect x="6.4" y="6.4" width="7.2" height="7.2" rx="1.6" fill="#FFFFFF"/></svg>';
    }
    if (state === 'moved' || state === 'confirmed') {
      return '<svg class="row-dot" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="10" fill="#2E9E7E"/><path d="M6 10.2 L8.6 12.8 L14 7.2" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    return '<svg class="row-dot" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="9.2" stroke="#C9CFD8" stroke-width="1.6" fill="none"/></svg>';
  }
  if (state === 'done') {
    return '<svg class="row-dot" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="10" fill="#2E9E7E"/><path d="M6 10.2 L8.6 12.8 L14 7.2" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  if (state === 'skip') {
    return '<svg class="row-dot" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="10" fill="#DFE3E8"/><rect x="6" y="9.2" width="8" height="1.6" rx="0.8" fill="#FFFFFF"/></svg>';
  }
  return '<svg class="row-dot" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="9.2" stroke="#C9CFD8" stroke-width="1.6" fill="none"/></svg>';
}

/* ============================================================
   5. 本地存储
   ============================================================ */
const DB = {
  KEY: 'qingdan.generator.v1',
  data: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (_) {}
    let d = null;
    if (raw) { try { d = JSON.parse(raw); } catch (_) { d = null; } }
    if (!d || typeof d !== 'object') d = {};
    this.data = {
      version: 1,
      lists: Array.isArray(d.lists) ? d.lists : [],
      templates: Array.isArray(d.templates) ? d.templates : [],
      items: Array.isArray(d.items) ? d.items : [],
      recent: Array.isArray(d.recent) ? d.recent : [],
      activeTab: d.activeTab || 'home',
      activeListId: d.activeListId || null
    };
    return this.data;
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch (e) { console.warn('保存失败', e); }
  }
};

/* ============================================================
   6. 导航栈
   ============================================================ */
const TABS = [
  { id: 'home', label: '首页', icon: 'home' },
  { id: 'create', label: '新建', icon: 'plus' },
  { id: 'template', label: '模板', icon: 'template' },
  { id: 'mine', label: '我的', icon: 'user' }
];

const Nav = {
  stacks: { home: [], create: [], template: [], mine: [] },
  active: 'home',
  animating: false,

  el(tab) { return $('.stack[data-tab="' + tab + '"]'); },

  /* 渲染并推入新页面 */
  push(tab, page) {
    const host = this.el(tab);
    const prev = this.stacks[tab][this.stacks[tab].length - 1];
    const screen = document.createElement('div');
    screen.className = 'screen push-in';
    screen.innerHTML = page.render();
    host.appendChild(screen);
    page.el = screen;
    this.stacks[tab].push(page);

    if (prev) prev.el.style.transform = '';
    // 强制重排后触发滑入
    void screen.offsetWidth;
    screen.classList.remove('push-in');
    if (prev) { prev.el.style.transform = 'translate3d(-24%,0,0)'; prev.el.classList.add('dim'); }
    if (page.onEnter) page.onEnter(screen);
    this.syncEdge();
    return page;
  },

  pop() {
    const tab = this.active;
    const stack = this.stacks[tab];
    if (stack.length <= 1) return false;
    const page = stack.pop();
    const prev = stack[stack.length - 1];
    page.el.classList.add('pop-out');
    if (prev) { prev.el.style.transform = ''; prev.el.classList.remove('dim'); }
    setTimeout(() => {
      if (page.el.parentNode) page.el.parentNode.removeChild(page.el);
      if (page.onLeave) page.onLeave();
      this.syncEdge();
    }, 290);
    if (prev && prev.onReenter) prev.onReenter(prev.el);
    return true;
  },

  /* 切换 Tab：保留各栈，重复点击当前 Tab 回到该栈根 */
  switchTab(tab) {
    if (this.active === tab) {
      if (this.stacks[tab].length > 1) this.popToRoot(tab);
      else this.scrollTop(tab);
      return;
    }
    const from = this.active;
    this.active = tab;
    $$('.stack').forEach((s) => s.classList.toggle('active', s.getAttribute('data-tab') === tab));
    this.renderTabBar();
    DB.data.activeTab = tab; DB.save();
    const stack = this.stacks[tab];
    if (stack.length && stack[stack.length - 1].onReenter) stack[stack.length - 1].onReenter(stack[stack.length - 1].el);
    this.syncEdge();
    // 滚到顶部
    const body = $('.stack[data-tab="' + tab + '"] .screen:last-child .screen-body');
    if (body) body.scrollTop = 0;
    return from;
  },

  popToRoot(tab) {
    const stack = this.stacks[tab];
    while (stack.length > 1) {
      const p = stack.pop();
      if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
    }
    const root = stack[0];
    if (root) { root.el.style.transform = ''; root.el.classList.remove('dim'); if (root.onReenter) root.onReenter(root.el); }
    this.syncEdge();
  },

  scrollTop(tab) {
    const body = $('.stack[data-tab="' + tab + '"] .screen:last-child .screen-body');
    if (!body) return;
    if (typeof body.scrollTo === 'function') body.scrollTo({ top: 0, behavior: 'smooth' });
    else body.scrollTop = 0;
  },

  /* 重建某个 Tab 的根页面 */
  reset(tab, pageFactory) {
    const host = this.el(tab);
    host.innerHTML = '';
    this.stacks[tab] = [];
    const page = pageFactory();
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.innerHTML = page.render();
    host.appendChild(screen);
    page.el = screen;
    this.stacks[tab].push(page);
    if (page.onEnter) page.onEnter(screen);
    this.syncEdge();
  },

  /* 重绘当前栈顶页面（保持滚动位置） */
  refresh() {
    const stack = this.stacks[this.active];
    if (!stack.length) return;
    const page = stack[stack.length - 1];
    const body = page.el.querySelector('.screen-body');
    const top = body ? body.scrollTop : 0;
    page.el.innerHTML = page.render();
    if (page.onEnter) page.onEnter(page.el);
    const nb = page.el.querySelector('.screen-body');
    if (nb) nb.scrollTop = top;
    this.syncEdge();
  },

  /* 重绘某个 Tab 的所有页面 */
  refreshTab(tab) {
    this.stacks[tab].forEach((page) => {
      const body = page.el.querySelector('.screen-body');
      const top = body ? body.scrollTop : 0;
      page.el.innerHTML = page.render();
      if (page.onEnter) page.onEnter(page.el);
      const nb = page.el.querySelector('.screen-body');
      if (nb) nb.scrollTop = top;
    });
  },

  syncEdge() {
    const stack = this.stacks[this.active];
    $('#edgeBack').style.display = stack && stack.length > 1 ? 'block' : 'none';
  },

  renderTabBar() {
    const bar = $('#tabbar');
    bar.innerHTML =
      '<div class="tab-pill">' +
      TABS.map((t) =>
        '<button class="tab-item' + (t.id === this.active ? ' on' : '') + '" data-tap="tab" data-arg="' + t.id + '">' +
        svg(t.icon, 'tab-ico') +
        '<span class="tab-label">' + t.label + '</span>' +
        '</button>'
      ).join('') +
      '</div>';
  }
};

/* ============================================================
   7. 边缘返回手势
   ============================================================ */
(function edgeBackGesture() {
  const edge = $('#edgeBack');
  let startX = 0, startY = 0, tracking = false, decided = false, dx = 0, cur = null, prev = null;

  edge.addEventListener('touchstart', (e) => {
    const stack = Nav.stacks[Nav.active];
    if (!stack || stack.length <= 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    tracking = true; decided = false; dx = 0;
    cur = stack[stack.length - 1];
    prev = stack[stack.length - 2];
  }, { passive: true });

  edge.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    const ddx = t.clientX - startX;
    const ddy = t.clientY - startY;
    if (!decided) {
      if (Math.abs(ddy) > Math.abs(ddx) && Math.abs(ddy) > 10) { tracking = false; return; }
      if (ddx > 6) decided = true;
      else if (ddx < -6) { tracking = false; return; }
    }
    if (!decided) return;
    dx = clamp(ddx, 0, window.innerWidth);
    document.body.setAttribute('data-dragging', '1');
    cur.el.classList.add('dragging');
    if (prev) prev.el.classList.add('dragging');
    cur.el.style.transform = 'translate3d(' + dx + 'px,0,0)';
    if (prev) {
      const p = -0.24 + (dx / window.innerWidth) * 0.24;
      prev.el.style.transform = 'translate3d(' + (p * 100) + '%,0,0)';
      prev.el.style.filter = 'brightness(' + (0.94 + 0.06 * (dx / window.innerWidth)) + ')';
    }
  }, { passive: true });

  function finish() {
    if (!tracking || !decided) { tracking = false; return; }
    tracking = false;
    document.body.removeAttribute('data-dragging');
    cur.el.classList.remove('dragging');
    if (prev) prev.el.classList.remove('dragging');
    const shouldPop = dx > window.innerWidth * 0.3;
    if (shouldPop) {
      cur.el.style.transition = '';
      cur.el.classList.add('pop-out');
      setTimeout(() => {
        if (cur.el.parentNode) cur.el.parentNode.removeChild(cur.el);
        if (prev) { prev.el.style.filter = ''; prev.el.classList.remove('dim'); }
      }, 290);
      const stack = Nav.stacks[Nav.active];
      const p = stack.pop();
      if (p.onLeave) p.onLeave();
      if (prev) {
        prev.el.style.transform = '';
        prev.el.style.filter = '';
        prev.el.classList.remove('dim');
        if (prev.onReenter) prev.onReenter(prev.el);
      }
      Nav.syncEdge();
    } else {
      cur.el.style.transform = '';
      if (prev) {
        prev.el.style.transform = 'translate3d(-24%,0,0)';
        prev.el.style.filter = '';
      }
    }
    dx = 0;
  }

  edge.addEventListener('touchend', finish, { passive: true });
  edge.addEventListener('touchcancel', finish, { passive: true });
})();

/* ============================================================
   8. Sheet / ActionSheet / 输入弹窗 / Toast
   ============================================================ */
const Sheet = {
  open(html, opts) {
    opts = opts || {};
    const host = $('#sheetHost');
    const mask = $('#sheetMask');
    host.innerHTML = '<div class="sheet">' +
      '<div class="sheet-grab"></div>' +
      (opts.title ? '<div class="sheet-title">' + esc(opts.title) + '</div>' : '') +
      '<div class="sheet-body">' + html + '</div>' +
      '</div>';
    mask.classList.add('on');
    void host.offsetWidth;
    host.querySelector('.sheet').classList.add('on');
    host.style.pointerEvents = 'auto';
    if (opts.onOpen) opts.onOpen(host);
    this.onClose = opts.onClose || null;
  },
  close() {
    const host = $('#sheetHost');
    const mask = $('#sheetMask');
    const s = host.querySelector('.sheet');
    if (s) s.classList.remove('on');
    mask.classList.remove('on');
    host.style.pointerEvents = 'none';
    if (this.onClose) { const f = this.onClose; this.onClose = null; f(); }
    setTimeout(() => { if (!mask.classList.contains('on')) host.innerHTML = ''; }, 300);
  },
  isOpen() { return $('#sheetMask').classList.contains('on'); }
};

$('#sheetMask').addEventListener('pointerdown', () => Sheet.close());

function actionSheet(title, actions) {
  const html = '<div class="sheet-actions">' + actions.map((a) =>
    '<button class="act-row' + (a.style ? ' ' + a.style : '') + '" data-tap="act" data-arg="' + a.key + '">' + esc(a.label) + '</button>'
  ).join('') + '</div>' +
    '<button class="act-row" data-tap="sheet-close">取消</button>';
  Sheet._actions = actions;
  Sheet.open(html, { title: title });
}

/* 文本输入弹窗（键盘避让已处理） */
function promptSheet(title, opts) {
  opts = opts || {};
  const html =
    '<div class="field" id="pf">' +
    '<input id="pi" type="text" placeholder="' + esc(opts.placeholder || '') + '" value="' + esc(opts.value || '') + '" ' +
    'autocomplete="off" autocorrect="off" autocapitalize="sentences" enterkeyhint="done" maxlength="' + (opts.max || 40) + '">' +
    '<button class="clear" data-tap="field-clear" data-arg="pi">×</button>' +
    '</div>' +
    (opts.hint ? '<div class="meta-line">' + esc(opts.hint) + '</div>' : '') +
    '<div class="cta-row">' +
    '<button class="cta ghost" data-tap="sheet-close">取消</button>' +
    '<button class="cta" data-tap="prompt-ok">' + esc(opts.ok || '确定') + '</button>' +
    '</div>';
  Sheet._promptCb = opts.onOk;
  Sheet.open(html, {
    title: title,
    onOpen() {
      const input = $('#pi');
      if (!input) return;
      $('#pf').classList.toggle('has-value', !!input.value);
      input.addEventListener('input', () => $('#pf').classList.toggle('has-value', !!input.value));
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); Bus.emit('tap', { action: 'prompt-ok' }); } });
      setTimeout(() => input.focus(), 260);
    }
  });
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

/* 键盘避让：输入框聚焦时抬起 Sheet / CTA */
(function keyboardAvoid() {
  const vv = window.visualViewport;
  if (!vv) return;
  const host = $('#sheetHost');
  function apply() {
    const offset = Math.max(0, window.innerHeight - vv.height - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0));
    host.style.transform = offset > 0 ? 'translateY(-' + offset + 'px)' : '';
  }
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
})();

/* 暴露到全局 */
window.App = { $, $$, esc, uid, clamp, svg, dotSvg, DB, Nav, TABS, Sheet, actionSheet, promptSheet, toast, Bus, Touch, ICONS };
})();

function genLife(scene, c) {
  const cats = (scene.items || []).map((g) => ({
    name: g[0],
    items: (g[1] || []).map((t) => ({ text: t }))
  }));
  if (scene.extra) {
    scene.extra.forEach((g) => {
      let target = cats.find((x) => x.name === g[0]);
      if (!target) { target = { name: g[0], items: [] }; cats.push(target); }
      g[1].forEach((t) => target.items.push({ text: t }));
    });
  }
  return cats;
}

/* ---------------- 统一生成入口 ---------------- */
function generate(sceneIds, conds) {
  const scenes = sceneIds.map((id) => SCENE_MAP[id]).filter(Boolean);
  if (!scenes.length) return { cats: [], kind: 'travel', title: '' };

  /* 主 kind 优先级：move > cat > travel > life */
  let kind = 'life';
  if (scenes.some((s) => s.kind === 'move')) kind = 'move';
  else if (scenes.some((s) => s.kind === 'cat')) kind = 'cat';
  else if (scenes.some((s) => s.kind === 'travel')) kind = 'travel';

  const mainScene = scenes.find((s) => s.kind === kind) || scenes[0];
  let cats = [];

  if (kind === 'move') cats = genMove(conds);
  else if (kind === 'cat') cats = genCat(conds);
  else if (kind === 'travel') {
    const light = scenes.some((s) => s.light) && !scenes.some((s) => s.kind === 'travel' && !s.light);
    cats = light ? genTravelLight(conds) : genTravel(conds);
  }
  else cats = genLife(mainScene, conds);

  /* 合并同类目去重 */
  const merged = [];
  const seenText = {};
  cats.forEach((g) => {
    let target = merged.find((x) => x.name === g.name);
    if (!target) { target = { name: g.name, items: [] }; merged.push(target); }
    g.items.forEach((it) => {
      const key = g.name + '/' + it.text;
      if (seenText[key]) return;
      seenText[key] = 1;
      target.items.push(it);
    });
  });

  /* 其他场景的附加项目（如猫咪外出、寄养） */
  scenes.forEach((s) => {
    if (s === mainScene) return;
    if (s.kind === 'life' && s.items) {
      s.items.forEach((g) => {
        let target = merged.find((x) => x.name === g[0]);
        if (!target) { target = { name: g[0], items: [] }; merged.push(target); }
        g[1].forEach((t) => {
          if (!target.items.some((x) => x.text === t)) target.items.push({ text: t });
        });
      });
    }
    if (s.extra) {
      s.extra.forEach((g) => {
        let target = merged.find((x) => x.name === g[0]);
        if (!target) { target = { name: g[0], items: [] }; merged.push(target); }
        g[1].forEach((t) => {
          if (!target.items.some((x) => x.text === t)) target.items.push({ text: t });
        });
      });
    }
  });

  return { cats: merged.filter((g) => g.items.length), kind: kind, scene: mainScene };
}

}

];

<script>
/* ============================================================
   清单生成器 · 页面渲染与业务逻辑
   ============================================================ */
(function () {
'use strict';

const A = window.App, D = window.Data;
const { $, $$, esc, uid, svg, dotSvg, DB, Nav, Sheet, actionSheet, promptSheet, toast, Bus } = A;

const STATUS_FLOW = {
  travel: ['todo', 'done', 'skip'],
  life: ['todo', 'done', 'skip'],
  cat: ['todo', 'done', 'skip'],
  move: ['todo', 'packed', 'moved', 'confirmed']
};
const MOVE_LABEL = { todo: '未整理', packed: '已装箱', moved: '已搬运', confirmed: '已确认' };

/* ============================================================
   数据操作
   ============================================================ */
function save() { DB.save(); }

function getList(id) { return DB.data.lists.find((l) => l.id === id); }
function getTpl(id) { return DB.data.templates.find((t) => t.id === id); }
/* 跨所有清单按 id 查找清单项（左/右按钮都只改这一条的状态） */
function findItem(id) {
  let found = null;
  DB.data.lists.forEach((l) => l.cats.forEach((g) => g.items.forEach((it) => { if (it.id === id) found = it; })));
  return found;
}

function stats(list) {
  let total = 0, done = 0, skip = 0, todo = 0, packed = 0, moved = 0, confirmed = 0;
  list.cats.forEach((g) => g.items.forEach((it) => {
    total++;
    if (list.kind === 'move') {
      if (it.status === 'packed') packed++;
      else if (it.status === 'moved') moved++;
      else if (it.status === 'confirmed') confirmed++;
      else todo++;
    } else {
      if (it.status === 'done') done++;
      else if (it.status === 'skip') skip++;
      else todo++;
    }
  }));
  if (list.kind === 'move') {
    const completed = moved + confirmed;
    return { total: total, done: completed, skip: 0, todo: todo, packed: packed, pct: total ? Math.round(completed / total * 100) : 0, label: '已搬运' };
  }
  const base = total - skip;
  return { total: total, done: done, skip: skip, todo: base - done, packed: 0, pct: base ? Math.round(done / base * 100) : 0, label: '已完成', base: base };
}

function hasItem(name) {
  const n = String(name || '');
  return DB.data.items.some((it) => n.indexOf(it.name) >= 0 || it.name.indexOf(n) >= 0);
}

function createList(sceneIds, conds, title) {
  const res = D.generate(sceneIds, conds);

    id: uid(),
    kind: res.kind,
    title: title || D.defaultTitle(sceneIds, conds),
    scenes: sceneIds.slice(),
    conds: JSON.parse(JSON.stringify(conds)),
    createdAt: Date.now(),
    filter: 'all',
    cats: res.cats.map((g) => ({
      name: g.name,
      items: g.items.map((it) => ({
        id: uid(), text: it.text, qty: it.qty || 0,
        sub: it.sub || '', cycle: it.cycle || '',
        status: 'todo', box: '', skipAt: 0
      }))
    }))
  };
  DB.data.lists.unshift(list);
  save();
  return list;
}

function pushRecent(sceneIds) {
  sceneIds.forEach((id) => {
    const i = DB.data.recent.indexOf(id);
    if (i >= 0) DB.data.recent.splice(i, 1);
    DB.data.recent.unshift(id);

}

/* ============================================================
   通用片段

function navBar(opts) {

function progressCard(list) {

    '<div class="progress-top">' +
    '<span class="progress-status">' + (s.done >= s.total && s.total ? '已全部完成' : '进行中') + '</span>' +
    '<span class="progress-count">' + s.label + ' ' + s.done + ' / ' + (list.kind === 'move' ? s.total : s.base) + '</span>' +

    '<div class="progress-note">' + note + '</div>' +
    '</div>';
}

/* ============================================================
   01 首页
   ============================================================ */
function homePage() {
  return {
    render() {

      const wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()];

          return '<button class="mini-card" data-tap="open-list" data-arg="' + l.id + '">' +

        ).join('') + '</div>'

      ].map((q) =>

      return '<div class="safe-top"></div>' +

        '<div class="page-head"><h1>我的清单</h1>' +
        '<button class="round-btn grey" data-tap="search" aria-label="搜索">' + svg('search', '') + '</button></div>' +
        '<div class="meta-line">' + dateStr + '</div>' +
        '<div class="section-row"><span class="section-title">进行中</span>' +
        '<button class="more" data-tap="history">全部清单</button></div>' +
        cards +
        '<div class="section-title">最近使用</div>' + recentHtml +
        '<div class="section-title">快速新建</div>' +

/* ============================================================
   02 新建 · 选择场景

const draft = { scenes: [], conds: {} };

function condsForScenes(ids) {

/* ---------------- 03 新建 · 补充条件 ---------------- */
function condPage() {

}

/* ============================================================
   清单行渲染辅助（三段式 / 排序 / FLIP 动画）
   ============================================================ */
/* 渲染排序：不需要(skip)沉到列表最下方，并按操作顺序(skipAt)排列；正常项保持原顺序 */
function sortRows(arr) {
  const normal = [], skip = [];
  arr.forEach((it) => { (it.status === 'skip') ? skip.push(it) : normal.push(it); });
  skip.sort((a, b) => (a.skipAt || 0) - (b.skipAt || 0));
  return normal.concat(skip);
}

/* 递增的「不需要」操作序号，用于沉底时的稳定排序 */
function nextSkipSeq() {
  let m = 0;
  DB.data.lists.forEach((l) => l.cats.forEach((g) => g.items.forEach((it) => { if (it.skipAt && it.skipAt > m) m = it.skipAt; })));
  return m + 1;
}

/* 完成状态控件：纯描边圆 + 细线勾选，靠 .on 切换，CSS 控制轻量描边动画 */
function checkSvg() {
  return '<svg class="check-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
    '<circle class="ck-circle" cx="12" cy="12" r="10.5"/>' +
    '<path class="ck-mark" d="M7 12.4 L10.4 15.8 L17 8.6"/></svg>';
}

/* 单条清单行：三段式 —— 左：完成按钮 / 中：内容 / 右：不需要 */
function renderItemRow(it, l, isMove, owned) {
  const qty = it.qty ? ' × ' + it.qty : '';
  const sub = it.sub ? '<span class="row-meta">' + esc(it.sub) + '</span>' : '';
  const cycle = it.cycle ? '<span class="tag-chip cycle">' + esc(it.cycle) + '</span>' : '';
  const box = isMove && it.box ? '<span class="tag-chip" data-tap="set-box" data-arg="' + it.id + '">箱' + esc(it.box) + '</span>' : '';
  const ownedTag = owned ? '<span class="tag-chip grey">已有</span>' : '';
  const tags = ownedTag + cycle + sub + box;
  const main = '<span class="row-main">' +
    '<span class="row-label">' + esc(it.text) + '<span class="row-meta">' + qty + '</span></span>' +
    (tags ? '<span class="row-tags">' + tags + '</span>' : '') +
    '</span>';

  /* 搬家清单：保留四态装箱流程，无「不需要」按钮 */
  if (isMove) {
    const cls = it.status === 'packed' ? ' packed' : (it.status === 'moved' ? ' moved' : (it.status === 'confirmed' ? ' confirmed' : ''));
    return '<div class="row' + cls + '" data-iid="' + it.id + '" data-lp="item" data-lp-id="' + it.id + '">' +
      '<button class="row-hit" data-tap="cycle-status" data-arg="' + it.id + '" aria-label="切换状态">' + dotSvg(it.status, l.kind) + '</button>' +
      main + '</div>';
  }

  const isDone = it.status === 'done';
  const isSkip = it.status === 'skip';
  const cls = isSkip ? ' skip' : (isDone ? ' done' : '');
  const left = '<button class="row-check' + (isDone ? ' on' : '') + '" data-tap="toggle-done" data-arg="' + it.id + '" aria-label="完成状态">' + checkSvg() + '</button>';
  const right = '<button class="row-skip' + (isSkip ? ' is-skip' : '') + '" data-tap="toggle-skip" data-arg="' + it.id + '" aria-label="不需要">' + (isSkip ? '恢复' : '不需要') + '</button>';
  return '<div class="row' + cls + '" data-iid="' + it.id + '" data-lp="item" data-lp-id="' + it.id + '">' + left + main + right + '</div>';
}

/* FLIP 重排：记录前后位置，用 transform 平滑移动，避免整页重绘跳动 */
function captureRects(root) {
  const m = new Map();
  root.querySelectorAll('.rows').forEach((cards) => {
    const cat = cards.getAttribute('data-cat') || '';
    Array.from(cards.children).forEach((ch) => {
      if (ch.classList.contains('add-row')) m.set('add:' + cat, ch.getBoundingClientRect());
      else { const id = ch.getAttribute('data-iid'); if (id) m.set(id, ch.getBoundingClientRect()); }
    });
  });
  return m;
}
function flip(pageEl, before, after, popId) {
  const nodeFor = (key) => {
    if (key.indexOf('add:') === 0) return pageEl.querySelector('.rows[data-cat="' + key.slice(4) + '"] .add-row');
    return pageEl.querySelector('.row[data-iid="' + key + '"]');
  };
  after.forEach((b, key) => {
    const a = before.get(key); if (!a) return;
    const dy = a.top - b.top, dx = a.left - b.left;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    const el = nodeFor(key); if (!el) return;
    el.style.transition = 'none';
    const sc = (key === popId) ? ' scale(.97)' : '';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)' + sc;
  });
  void pageEl.offsetWidth;
  after.forEach((b, key) => {
    const a = before.get(key); if (!a) return;
    const dy = a.top - b.top, dx = a.left - b.left;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    const el = nodeFor(key); if (!el) return;
    el.style.transition = 'transform .3s cubic-bezier(.32,.72,0,1)';
    el.style.transform = '';
  });
}
function flipReorder(pageEl, renderFn, popId) {
  /* 先取消进行中的动画，避免连续点击叠加导致位置错乱 */
  pageEl.querySelectorAll('.rows > *').forEach((el) => { el.style.transition = 'none'; el.style.transform = ''; });
  const before = captureRects(pageEl);
  const body = pageEl.querySelector('.screen-body');
  const top = body ? body.scrollTop : 0;
  pageEl.innerHTML = renderFn();
  const nb = pageEl.querySelector('.screen-body');
  if (nb) nb.scrollTop = top;
  const after = captureRects(pageEl);
  flip(pageEl, before, after, popId);
}

/* ============================================================
   04/05/06 清单详情
   ============================================================ */
function listPage(listId) {
  return {
    listId: listId,
    render() {
      const l = getList(listId);
      if (!l) return '<div class="safe-top"></div><div class="screen-body"><div class="empty"><div class="t1x">清单不存在</div></div></div>';
      const isMove = l.kind === 'move';
      const isCat = l.kind === 'cat';

      /* 筛选 */
      const filters = isMove
        ? [['all', '全部'], ['todo', '未整理'], ['packed', '已装箱'], ['moved', '已搬运'], ['confirmed', '已确认']]
        : [['all', '全部'], ['todo', '未完成'], ['done', '已完成'], ['skip', '不需要']];
      const filterHtml = '<div class="filter-row">' + filters.map((f) =>
        '<button class="chip-seg' + (l.filter === f[0] ? ' on' : '') + '" data-tap="set-filter" data-arg="' + f[0] + '">' + f[1] + '</button>'
      ).join('') + '</div>';

      /* 养猫阶段切换 */
      let stageHtml = '';
      if (isCat) {
        stageHtml = '<div class="filter-row">' + l.cats.map((g, i) =>
          '<button class="chip-seg' + ((l.stage || 0) === i ? ' on' : '') + '" data-tap="set-stage" data-arg="' + i + '">' + esc(g.name) + '</button>'
        ).join('') + '</div>';
      }

      /* 箱号条 */
      let boxHtml = '';
      if (isMove) {
        const boxes = {};
        l.cats.forEach((g) => g.items.forEach((it) => { if (it.box) boxes[it.box] = (boxes[it.box] || 0) + 1; }));
        const keys = Object.keys(boxes).sort();
        boxHtml = '<div class="card pad-sm"><div class="section-row" style="margin-bottom:10px">' +
          '<span class="section-title">箱号</span>' +
          '<button class="more" data-tap="manage-box">管理</button></div>' +
          (keys.length
            ? '<div class="chips-scroll">' + keys.map((k) =>
              '<button class="chip-tag" data-tap="pick-box-filter" data-arg="' + esc(k) + '">箱' + esc(k) + ' · ' + boxes[k] + ' 件</button>'
            ).join('') + '</div>'
            : '<div class="meta-line">还没有设置箱号。长按项目可设置所属箱号。</div>') +
          '</div>';
      }

      /* 项目列表 */
      const showCats = isCat ? [l.cats[l.stage || 0]] : l.cats;
      const totalItems = (showCats || []).reduce((a, g) => a + g.items.length, 0);
      let shownCount = 0;
      let body = '';
      (showCats || []).forEach((g) => {
        let items = g.items.filter((it) => {
          if (l.filter === 'all') return true;
          return it.status === l.filter;
        });
        /* 全部视图：不需要的项按操作顺序沉到列表最下方 */
        if (l.filter === 'all') items = sortRows(items);
        shownCount += items.length;
        const rows = items.map((it) => renderItemRow(it, l, isMove, hasItem(it.text))).join('');

        const addBtn = '<button class="add-row" data-tap="add-item" data-arg="' + esc(g.name) + '">' +
          svg('plus', 'plus') + '<span>添加项目</span></button>';

        body += '<div class="section-title">' + esc(g.name) + ' · ' + g.items.length + ' 项</div>' +
          '<div class="card"><div class="rows" data-cat="' + esc(g.name) + '">' + (rows || '') + addBtn + '</div></div>';
      });

      if (l.filter !== 'all' && totalItems > 0 && shownCount === 0) {
        body = '<div class="card pad"><div class="empty">' + svg('archive', 'ico') +
          '<div class="t1x">这个状态下没有项目</div><div class="t2x">换个筛选条件看看</div></div></div>';
      } else if (!body) {
        body = '<div class="card pad"><div class="empty">' + svg('archive', 'ico') +
          '<div class="t1x">这里没有项目</div><div class="t2x">换个筛选条件看看</div></div></div>';
      }

      const meta = (l.scenes || []).map((id) => D.SCENE_MAP[id] ? D.SCENE_MAP[id].name : '').filter(Boolean).join(' + ');

      return '<div class="safe-top"></div>' +
        '<div class="screen-body">' +
        navBar({
          title: l.title, back: true,
          right: '<button class="nav-btn icon" data-tap="list-menu" aria-label="更多">' + svg('more', '') + '</button>'
        }) +
        '<div class="meta-line">' + (meta ? '来自 ' + esc(meta) + ' · ' : '') + '创建于 ' + fmtDate(l.createdAt) + '</div>' +
        progressCard(l) +
        (isMove ? boxHtml : '') +
        stageHtml +
        filterHtml +
        body +
        '</div>';
    },
    onReenter(el) { repaint(el, this); }
  };
}

function fmtDate(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

/* 重绘页面并保留滚动位置 */
function repaint(el, owner) {
  const b = el.querySelector('.screen-body');

  el.innerHTML = owner.render();
  const nb = el.querySelector('.screen-body');
  if (nb) nb.scrollTop = top;
}
function reenter(el, owner) { repaint(el, owner); }

/* ============================================================
   长按排序
   ============================================================ */
function startItemSort(row, ev) {
  const list = row.parentNode;
  const rect = row.getBoundingClientRect();
  const startY = ev.clientY;
  let mode = 'idle';

  const ph = document.createElement('div');
  ph.style.height = rect.height + 'px';
  ph.style.background = 'rgba(46,158,126,.08)';
  ph.style.borderRadius = '12px';
  list.insertBefore(ph, row);

  row.style.position = 'fixed';
  row.style.left = rect.left + 'px';
  row.style.top = rect.top + 'px';
  row.style.width = rect.width + 'px';
  row.style.zIndex = '300';
  row.style.pointerEvents = 'none';
  row.style.boxShadow = '0 10px 24px -6px rgba(20,22,26,.3)';
  row.classList.add('sorting');
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }

  function move(e) {
    const dy = e.clientY - startY;
    if (mode === 'idle') {
      if (Math.abs(dy) < 6) return;
      mode = 'drag';
      document.body.setAttribute('data-dragging', '1');
    }
    e.preventDefault();
    row.style.top = (rect.top + dy) + 'px';
    const rows = Array.from(list.querySelectorAll('.row[data-iid]'));
    let target = null;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (r === row) continue;
      const rr = r.getBoundingClientRect();
      if (e.clientY < rr.top + rr.height / 2) { target = r; break; }
    }
    if (target) list.insertBefore(ph, target);
    else list.appendChild(ph);
  }

  function up() {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    document.body.removeAttribute('data-dragging');
    list.insertBefore(row, ph);
    if (ph.parentNode) ph.parentNode.removeChild(ph);
    row.style.position = ''; row.style.left = ''; row.style.top = ''; row.style.width = '';
    row.style.zIndex = ''; row.style.boxShadow = ''; row.style.pointerEvents = '';
    row.classList.remove('sorting');
    if (mode !== 'drag') { return; }

    /* 提交顺序 */
    const ids = Array.from(list.querySelectorAll('.row[data-iid]')).map((r) => r.getAttribute('data-iid'));
    const catName = list.getAttribute('data-cat');
    const stack = Nav.stacks[Nav.active];
    const page = stack[stack.length - 1];
    const l = getList(page.listId);
    if (!l) return;
    const g = l.cats.find((x) => x.name === catName);
    if (!g) return;
    const map = {};
    g.items.forEach((it) => { map[it.id] = it; });
    const next = ids.map((id) => map[id]).filter(Boolean);
    g.items.forEach((it) => { if (next.indexOf(it) < 0) next.push(it); });
    g.items = next;
    save();
    toast('顺序已更新');
  }

  document.addEventListener('pointermove', move, { passive: false });
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

  ];

  acts.push({ key: 'own', label: hasItem(item.text) ? '从物品库移除' : '加入我的物品库' });
  acts.push({ key: 'del', label: '删除项目', style: 'danger' });

  actionSheet(item.text, acts);
  Sheet._acts = acts;
  Sheet._ctx = { iid: iid, listId: l.id, catName: cat.name };
}

/* ============================================================
   事件分发
   ============================================================ */
Bus.on('tap', (e) => {
  const act = e.action, arg = e.arg;
  const stack = Nav.stacks[Nav.active];
  const page = stack[stack.length - 1];

  switch (act) {
    case 'noop': return;

    /* --- Tab --- */
    case 'tab':
      if (arg === 'create') {
        if (Nav.active === 'create') { draft.scenes = []; Nav.reset('create', createPage); }
        else Nav.switchTab('create');
      } else {
        Nav.switchTab(arg);
      }
      return;

    case 'back': Nav.pop(); return;
    case 'sheet-close': Sheet.close(); return;

    /* --- 首页 --- */
    case 'open-list': {
      Nav.push(Nav.active, listPage(arg));
      DB.data.activeListId = arg; save();
      return;
    }
    case 'history': Nav.push(Nav.active, historyPage()); return;
    case 'search': Nav.push(Nav.active, searchPage()); return;

    case 'quick-start':
    case 'quick-scene': {
      draft.scenes = [arg];
      if (Nav.active !== 'create') Nav.switchTab('create');
      Nav.reset('create', createPage);
      Nav.push('create', buildCondPage());
      return;
    }

    /* --- 新建 --- */
    case 'toggle-scene': {
      const i = draft.scenes.indexOf(arg);
      if (i >= 0) draft.scenes.splice(i, 1); else draft.scenes.push(arg);
      page.el.innerHTML = page.render();
      return;
    }
    case 'to-cond': {
      Nav.push('create', buildCondPage());
      return;
    }
    case 'pick-cond': {
      const p = arg.split('|');
      draft.conds[p[0]] = p[1];
      page.el.innerHTML = page.render();
      return;
    }
    case 'toggle-switch': {
      draft.conds[arg] = !draft.conds[arg];
      page.el.innerHTML = page.render();
      return;
    }
    case 'do-generate': {
      const list = createList(draft.scenes, draft.conds);
      pushRecent(draft.scenes);
      save();
      Nav.popToRoot('create');
      Nav.switchTab('home');
      Nav.refreshTab('home');
      Nav.push('home', listPage(list.id));
      toast('已生成 ' + stats(list).total + ' 项清单');
      return;
    }

    /* --- 清单详情 --- */
    case 'cycle-status': {
      const l = getList(page.listId);
      if (!l) return;
      const flow = STATUS_FLOW[l.kind] || STATUS_FLOW.travel;
      l.cats.forEach((g) => g.items.forEach((it) => {
        if (it.id === arg) {
          const i = flow.indexOf(it.status || 'todo');
          it.status = flow[(i + 1) % flow.length];
        }
      }));
      save();
      const b = page.el.querySelector('.screen-body');
      const top = b ? b.scrollTop : 0;
      page.el.innerHTML = page.render();
      const nb = page.el.querySelector('.screen-body');
      if (nb) nb.scrollTop = top;
      return;
    }
    case 'set-filter': {
      const l = getList(page.listId);
      if (!l) return;
      l.filter = arg; save();
      page.el.innerHTML = page.render();
      return;
    }
    case 'set-stage': {
      const l = getList(page.listId);
      if (!l) return;
      l.stage = parseInt(arg, 10); save();
      page.el.innerHTML = page.render();
      const b = page.el.querySelector('.screen-body');
      if (b) b.scrollTop = 0;
      return;
    }

    /* 左侧完成按钮：仅切换 未完成↔已完成，与右侧「不需要」完全独立 */
    case 'toggle-done': {
      const l = getList(page.listId);
      if (!l) return;
      const it = findItem(arg);
      if (!it) return;
      if (it.status === 'skip') return;                 // 已经是「不需要」时不响应左侧
      it.status = (it.status === 'done') ? 'todo' : 'done';
      save();
      if (l.filter === 'all') {
        /* 位置不变，直接原地切 class，轻量不重绘、不跳动 */
        const row = page.el.querySelector('.row[data-iid="' + arg + '"]');
        const btn = row ? row.querySelector('.row-check') : null;
        if (btn) btn.classList.toggle('on', it.status === 'done');
        if (row) row.classList.toggle('done', it.status === 'done');
        /* 进度卡同步刷新（只换文本，不重绘整页、不跳动） */
        const pc = page.el.querySelector('.progress-card');
        if (pc) pc.outerHTML = progressCard(l);
      } else {
        page.el.innerHTML = page.render();
      }
      return;
    }

    /* 右侧「不需要」：独立状态；标记后平滑沉到列表最下方，再次点击恢复为正常 */
    case 'toggle-skip': {
      const l = getList(page.listId);
      if (!l) return;
      const it = findItem(arg);
      if (!it) return;
      if (it.status === 'skip') { it.status = 'todo'; it.skipAt = 0; }
      else { it.status = 'skip'; it.skipAt = nextSkipSeq(); }
      save();
      if (l.filter === 'all') {
        flipReorder(page.el, () => listPage(l.id).render(), arg);
      } else {
        page.el.innerHTML = page.render();
      }
      return;
    }
    case 'add-item': {
      promptSheet('添加到「' + arg + '」', {
        placeholder: '项目名称',
        ok: '添加',
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          const l = getList(page.listId);
          if (!l) return;
          let g = l.cats.find((x) => x.name === arg);
          if (!g) { g = { name: arg, items: [] }; l.cats.push(g); }
          g.items.push({ id: uid(), text: v, qty: 0, sub: '', cycle: '', status: 'todo', box: '', skipAt: 0 });
          save();
          Sheet.close();
          page.el.innerHTML = page.render();
          toast('已添加');
        }
      });
      return;
    }
    case 'set-box': {
      const l = getList(page.listId);
      if (!l) return;
      let item = null;
      l.cats.forEach((g) => g.items.forEach((it) => { if (it.id === arg) item = it; }));
      if (!item) return;
      openBoxSheet(l, item);
      return;
    }
    case 'manage-box': {
      const l = getList(page.listId);
      if (!l) return;
      const boxes = {};
      l.cats.forEach((g) => g.items.forEach((it) => { if (it.box) boxes[it.box] = (boxes[it.box] || 0) + 1; }));
      const keys = Object.keys(boxes).sort();
      const html = (keys.length
        ? '<div class="card"><div class="rows">' + keys.map((k) =>
          '<div class="row"><span class="row-label">箱' + esc(k) + '</span>' +
          '<span class="row-meta">' + boxes[k] + ' 件</span></div>').join('') + '</div></div>'
        : '<div class="meta-line">还没有设置箱号</div>') +
        '<div class="tip-bar">' + svg('info', 'ico') + '<span>长按清单项目即可设置或清除箱号</span></div>';
      Sheet.open(html, { title: '箱号管理' });
      return;
    }
    case 'pick-box-filter': {
      toast('已筛选箱' + arg + '，可在项目上长按修改');
      return;
    }
    case 'list-menu': {
      const l = getList(page.listId);
      if (!l) return;
      const acts = [
        { key: 'rename', label: '重命名清单' },
        { key: 'save-tpl', label: '保存为我的模板' },
        { key: 'reset', label: '重置为全部未完成' },
        { key: 'del', label: '删除清单', style: 'danger' }
      ];
      Sheet._acts = acts;
      Sheet._ctx = { listId: l.id };
      actionSheet(l.title, acts);
      return;
    }

    /* --- 模板 --- */
    case 'use-sys-tpl': {
      const t = D.SYSTEM_TEMPLATES.find((x) => x.id === arg);
      if (!t) return;
      const list = createList(t.scenes, JSON.parse(JSON.stringify(t.conds)), t.name + ' · ' + (new Date().getMonth() + 1) + '月');
      pushRecent(t.scenes);
      save();
      Nav.switchTab('home');
      Nav.refreshTab('home');
      Nav.push('home', listPage(list.id));
      toast('已用模板生成清单');
      return;
    }
    case 'open-tpl': Nav.push(Nav.active, tplPage(arg)); return;
    case 'use-tpl': {
      const t = getTpl(arg);
      if (!t) return;
      const list = {
        id: uid(), kind: t.kind, title: t.name + ' · ' + (new Date().getMonth() + 1) + '月',
        scenes: [], conds: {}, createdAt: Date.now(), filter: 'all', stage: 0,
        cats: JSON.parse(JSON.stringify(t.cats)).map((g) => ({
          name: g.name,
          items: (g.items || []).map((it) => ({
            id: uid(), text: it.text, qty: it.qty || 0,
            sub: it.sub || '', cycle: it.cycle || '',
            status: 'todo', box: '', skipAt: 0
          }))
        }))
      };
      DB.data.lists.unshift(list);
      save();
      Nav.switchTab('home');
      Nav.refreshTab('home');
      Nav.push('home', listPage(list.id));
      toast('已用模板生成清单');
      return;
    }
    case 'new-tpl': {
      promptSheet('新建模板', {
        placeholder: '模板名称，例如 我的周末出行',
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          const t = { id: uid(), name: v, kind: 'life', desc: '自定义', createdAt: Date.now(), cats: [{ name: '未分类', items: [] }] };
          DB.data.templates.unshift(t); save();
          Sheet.close();
          Nav.push(Nav.active, tplPage(t.id));
        }
      });
      return;
    }
    case 'tpl-menu': {
      const stack2 = Nav.stacks[Nav.active];
      const p2 = stack2[stack2.length - 1];
      const tplId = (p2.el.querySelector('[data-tap="use-tpl"]') || {}).getAttribute ? p2.el.querySelector('[data-tap="use-tpl"]').getAttribute('data-arg') : null;
      if (!tplId) return;
      const acts = [
        { key: 'add-tpl-item', label: '添加项目' },
        { key: 'rename-tpl', label: '重命名模板' },
        { key: 'del-tpl', label: '删除模板', style: 'danger' }
      ];
      Sheet._acts = acts;
      Sheet._ctx = { tplId: tplId };
      actionSheet('模板操作', acts);
      return;
    }

    /* --- 物品库 --- */
    case 'open-items': Nav.push(Nav.active, itemsPage()); return;
    case 'add-item-lib': {
      promptSheet('添加物品', {
        placeholder: '物品名称',
        hint: '加入后，清单里同名项目会显示「已有」',
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          if (DB.data.items.some((i) => i.name === v)) { toast('已经在物品库里了'); return; }
          DB.data.items.unshift({ id: uid(), name: v }); save();
          Sheet.close();
          page.el.innerHTML = page.render();
          toast('已加入物品库');
        }
      });
      return;
    }
    case 'del-item-lib': {
      DB.data.items = DB.data.items.filter((i) => i.id !== arg);
      save();
      page.el.innerHTML = page.render();
      toast('已移出物品库');
      return;
    }

    /* --- 表单 --- */
    case 'field-clear': {
      const el = document.getElementById(arg);
      if (el) {
        el.value = '';
        const f = el.parentNode; f.classList.remove('has-value');
        el.focus();
        if (arg === 'si') renderSearch('');
      }
      return;
    }
    case 'prompt-ok': {
      const cb = Sheet._promptCb; Sheet._promptCb = null;
      const v = ($('#pi') ? $('#pi').value.trim() : '');
      if (cb) cb(v);
      return;
    }

    /* --- ActionSheet 选项 --- */
    case 'act': {
      const acts = Sheet._acts || [];
      const ctx = Sheet._ctx || {};
      Sheet.close();
      const a = acts.find((x) => x.key === arg);
      if (!a) return;
      handleAction(arg, ctx);
      return;
    }
  }
});

/* ActionSheet 后续动作 */
function handleAction(key, ctx) {
  const stack = Nav.stacks[Nav.active];
  const page = stack[stack.length - 1];

  /* 清单项目 */
  if (['edit', 'move', 'box', 'own', 'del'].indexOf(key) >= 0 && ctx.iid) {
    const l = getList(ctx.listId);
    if (!l) return;
    let item = null, cat = null;
    l.cats.forEach((g) => g.items.forEach((it) => { if (it.id === ctx.iid) { item = it; cat = g; } }));
    if (!item) return;

    if (key === 'edit') {
      promptSheet('编辑项目', {
        value: item.text,
        onOk(v) {
          if (!v) { toast('名称不能为空'); return; }
          item.text = v; save(); Sheet.close();
          page.el.innerHTML = page.render();
          toast('已更新');
        }
      });
      return;
    }
    if (key === 'move') {
      const html = '<div class="cat-grid">' + l.cats.map((g) =>
        '<button class="cond-opt' + (g.name === cat.name ? ' on' : '') + '" data-tap="act" data-arg="cat:' + esc(g.name) + '">' + esc(g.name) + '</button>'
      ).join('') + '</div>' +
        '<div class="tip-bar">' + svg('info', 'ico') + '<span>选择要移动到的分类</span></div>';
      Sheet._acts = l.cats.map((g) => ({ key: 'cat:' + g.name, label: g.name }));
      Sheet._ctx = ctx;
      Sheet.open(html, { title: '修改分类' });
      return;
    }
    if (key === 'box') { openBoxSheet(l, item); return; }
    if (key === 'own') {
      if (hasItem(item.text)) {
        DB.data.items = DB.data.items.filter((i) => !(item.text.indexOf(i.name) >= 0 || i.name.indexOf(item.text) >= 0));
        toast('已移出物品库');
      } else {
        DB.data.items.unshift({ id: uid(), name: item.text });
        toast('已加入物品库');
      }
      save();
      page.el.innerHTML = page.render();
      return;
    }
    if (key === 'del') {
      cat.items = cat.items.filter((x) => x.id !== item.id);
      save();
      page.el.innerHTML = page.render();
      toast('已删除');
      return;
    }
    return;
  }

  /* 分类移动 */
  if (key.indexOf('cat:') === 0) {
    const target = key.slice(4);
    const l = getList(ctx.listId);
    if (!l) return;
    let item = null, from = null;
    l.cats.forEach((g) => g.items.forEach((it) => { if (it.id === ctx.iid) { item = it; from = g; } }));
    if (!item || !from) return;
    if (from.name === target) return;
    from.items = from.items.filter((x) => x.id !== item.id);
    let to = l.cats.find((g) => g.name === target);
    if (!to) { to = { name: target, items: [] }; l.cats.push(to); }
    to.items.push(item);
    save();
    page.el.innerHTML = page.render();
    toast('已移动到「' + target + '」');
    return;
  }

  /* 清单级 */
  if (ctx.listId) {
    const l = getList(ctx.listId);
    if (!l) return;
    if (key === 'rename') {
      promptSheet('重命名清单', {
        value: l.title,
        onOk(v) {
          if (!v) { toast('名称不能为空'); return; }
          l.title = v; save(); Sheet.close();
          page.el.innerHTML = page.render();
          toast('已重命名');
        }
      });
      return;
    }
    if (key === 'save-tpl') {
      promptSheet('保存为我的模板', {
        value: l.title,
        hint: '保存后可在「模板」里反复使用，不会改动这份清单',
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          DB.data.templates.unshift({
            id: uid(), name: v, kind: l.kind,
            desc: l.kind === 'move' ? '含箱号' : (l.kind === 'cat' ? '分阶段' : '自定义'),
            createdAt: Date.now(),
            cats: JSON.parse(JSON.stringify(l.cats))
          });
          save(); Sheet.close();
          toast('已保存为我的模板');
        }
      });
      return;
    }
    if (key === 'reset') {
      l.cats.forEach((g) => g.items.forEach((it) => { it.status = 'todo'; }));
      save();
      page.el.innerHTML = page.render();
      toast('已重置');
      return;
    }
    if (key === 'del') {
      DB.data.lists = DB.data.lists.filter((x) => x.id !== l.id);
      save();
      Nav.pop();
      Nav.refreshTab('home');
      Nav.refreshTab('mine');
      toast('清单已删除');
      return;
    }
  }

  /* 模板级 */
  if (ctx.tplId) {
    const t = getTpl(ctx.tplId);
    if (!t) return;
    if (key === 'add-tpl-item') {
      promptSheet('添加项目', {
        placeholder: '项目名称',
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          t.cats[0].items.push({ text: v, qty: 0, sub: '', cycle: '' });
          save(); Sheet.close();
          page.el.innerHTML = page.render();
        }
      });
      return;
    }
    if (key === 'rename-tpl') {
      promptSheet('重命名模板', {
        value: t.name,
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          t.name = v; save(); Sheet.close();
          page.el.innerHTML = page.render();
        }
      });
      return;
    }
    if (key === 'del-tpl') {
      DB.data.templates = DB.data.templates.filter((x) => x.id !== t.id);
      save();
      Nav.pop();
      Nav.refreshTab('template');
      toast('模板已删除');
      return;
    }
  }

  /* 历史清单长按 */
  if (ctx.listLongPress) {
    const l = getList(ctx.listLongPress);
    if (!l) return;
    if (key === 'save-tpl') {
      promptSheet('保存为我的模板', {
        value: l.title,
        onOk(v) {
          if (!v) { toast('请输入名称'); return; }
          DB.data.templates.unshift({
            id: uid(), name: v, kind: l.kind, desc: '自定义', createdAt: Date.now(),
            cats: JSON.parse(JSON.stringify(l.cats))
          });
          save(); Sheet.close();
          toast('已保存为我的模板');
        }
      });
    }
    if (key === 'del') {
      DB.data.lists = DB.data.lists.filter((x) => x.id !== l.id);
      save();
      page.el.innerHTML = page.render();
      Nav.refreshTab('home');
      Nav.refreshTab('mine');
      toast('清单已删除');
    }
  }
}

/* 箱号 Sheet */
function openBoxSheet(list, item) {
  const nums = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
  const used = {};
  list.cats.forEach((g) => g.items.forEach((it) => { if (it.box) used[it.box] = (used[it.box] || 0) + 1; }));
  const html = '<div class="box-grid">' + nums.map((n) =>
    '<button class="box-opt' + (item.box === n ? ' on' : '') + '" data-tap="act" data-arg="box:' + n + '">' + n + '</button>'
  ).join('') + '</div>' +
    (item.box ? '<button class="act-row danger" data-tap="act" data-arg="box:clear">清除箱号</button>' : '') +
    '<div class="tip-bar">' + svg('info', 'ico') + '<span>把同一箱的物品设为同一个箱号，搬运时按箱清点</span></div>';
  Sheet._acts = nums.map((n) => ({ key: 'box:' + n, label: n })).concat([{ key: 'box:clear', label: '清除' }]);
  Sheet._ctx = { iid: item.id, listId: list.id };
  Sheet.open(html, { title: '设置箱号' });
}

/* 箱号动作 */
Bus.on('tap', (e) => {
  if (e.action !== 'act') return;
  const key = e.arg;
  if (key.indexOf('box:') !== 0) return;
  const ctx = Sheet._ctx || {};
  Sheet.close();
  const l = getList(ctx.listId);
  if (!l) return;
  let item = null;
  l.cats.forEach((g) => g.items.forEach((it) => { if (it.id === ctx.iid) item = it; }));
  if (!item) return;
  const v = key.slice(4);
  item.box = (v === 'clear') ? '' : v;
  save();
  const stack = Nav.stacks[Nav.active];
  const page = stack[stack.length - 1];
  if (page && page.el) page.el.innerHTML = page.render();
  toast(v === 'clear' ? '已清除箱号' : '已设为箱' + v);
});

/* ============================================================
   长按
   ============================================================ */
Bus.on('longpress', (e) => {
  if (e.kind === 'item') {
    const el = e.el;
    const ev = window.__lastPointer || { clientY: 0 };
    startItemSort(el, ev);
    /* 松手时若未拖动 → 弹出菜单 */
    const onUp = () => {
      document.removeEventListener('pointerup', onUp);
      setTimeout(() => {
        if (!el.classList.contains('sorting')) itemMenu(e.id);
      }, 30);
    };
    document.addEventListener('pointerup', onUp);
    return;
  }
  if (e.kind === 'list') {
    const acts = [
      { key: 'save-tpl', label: '保存为我的模板' },
      { key: 'del', label: '删除清单', style: 'danger' }
    ];
    Sheet._acts = acts;
    Sheet._ctx = { listLongPress: e.id };
    actionSheet('清单操作', acts);
    return;
  }
});

/* 记录最近一次 pointer 位置，供长按排序使用 */
document.addEventListener('pointerdown', (e) => { window.__lastPointer = { clientX: e.clientX, clientY: e.clientY }; }, { passive: true });

/* 按所选场景初始化条件默认值，返回条件选择页 */
function buildCondPage() {
  const keys = condsForScenes(draft.scenes);
  const next = {};
  keys.forEach((k) => {
    const c = D.CONDS[k];
    if (!c) return;
    next[k] = (c.type === 'switch') ? !!c.def : (c.def || '');
  });
  draft.scenes.forEach((id) => {
    const s = D.SCENE_MAP[id];
    if (s && s.preset) Object.keys(s.preset).forEach((k) => { if (keys.indexOf(k) >= 0) next[k] = s.preset[k]; });
  });
  draft.conds = next;
  return condPage();
}

/* ============================================================
   启动
   ============================================================ */
function seedDemo() {
  if (DB.data.lists.length) return;
  /* 三份示例清单，对应设计稿首页 */
  const mk = (scenes, conds, title, plan) => {
    const l = createList(scenes, conds, title);
    let i = 0;
    l.cats.forEach((g) => g.items.forEach((it) => {
      const idx = i++;
      if (plan.mark === 'travel') {
        if (idx < plan.done) it.status = 'done';
        else if (idx >= plan.total - plan.skip) it.status = 'skip';
      } else if (plan.mark === 'move') {
        if (idx < plan.done) it.status = 'moved';
        else if (idx < plan.done + plan.packed) it.status = 'packed';
      } else {
        if (idx < plan.done) it.status = 'done';
      }
    }));
    return l;
  };

  const t = D.generate(['travel'], { days: '3', transport: 'plane', stay: 'hotel', season: 'autumn', photo: true, activity: 'none' });
  const tt = t.cats.reduce((a, g) => a + g.items.length, 0);
  mk(['travel'], { days: '3', transport: 'plane', stay: 'hotel', season: 'autumn', photo: true, activity: 'none' },
    '2026年9月上海旅行', { mark: 'travel', done: Math.min(23, tt - 3), skip: 3, total: tt });

  const m = D.generate(['moving'], { furniture: 'yes', appliance: 'yes', mover: 'company' });
  const mt = m.cats.reduce((a, g) => a + g.items.length, 0);
  mk(['moving'], { furniture: 'yes', appliance: 'yes', mover: 'company' },
    '浦东 → 徐汇 搬家', { mark: 'move', done: Math.min(42, mt - 14), packed: 12, total: mt });

  const c = D.generate(['catready'], { catAge: 'kitten', catCount: 'one', firstTime: 'yes', pickup: true });
  const ct = c.cats.reduce((a, g) => a + g.items.length, 0);
  mk(['catready'], { catAge: 'kitten', catCount: 'one', firstTime: 'yes', pickup: true },
    '养猫准备', { mark: 'cat', done: Math.min(15, ct), total: ct });

  DB.data.recent = ['concert', 'business', 'shopping', 'weekend'];
  save();
}

function boot() {
  DB.load();
  if (!DB.data.items.length) {
    DB.data.items = D.DEFAULT_ITEMS.map((n) => ({ id: uid(), name: n }));
  }
  seedDemo();

  Nav.reset('home', homePage);
  Nav.reset('create', createPage);
  Nav.reset('template', templatesPage);
  Nav.reset('mine', minePage);

  const tab = DB.data.activeTab && ['home', 'create', 'template', 'mine'].indexOf(DB.data.activeTab) >= 0 ? DB.data.activeTab : 'home';
  Nav.active = tab;
  $$('.stack').forEach((s) => s.classList.toggle('active', s.getAttribute('data-tab') === tab));
  Nav.renderTabBar();
  Nav.syncEdge();

  /* 恢复上次查看的清单 */
  if (DB.data.activeListId && getList(DB.data.activeListId)) {
    Nav.push(tab, listPage(DB.data.activeListId));
  }

  /* iOS 独立模式防止整页滚动 */
  document.addEventListener('touchmove', (e) => {
    if (!e.target.closest('.screen-body') && !e.target.closest('.sheet-body') && !e.target.closest('.chips-scroll')) {
      e.preventDefault();
    }
  }, { passive: false });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
